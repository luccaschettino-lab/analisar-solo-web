<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moinho</title>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <!-- Manrope vem do pacote @fontsource-variable/manrope (importado em
         main.jsx): geometria arredondada parecida com o wordmark da marca,
         servida pelo próprio site, sem pedir nada ao Google. -->
    <!-- Tema antes do React: escuro, a não ser que a pessoa tenha escolhido o
         claro. Mesma regra de ThemeContext.jsx; sem isto a tela pisca branca. -->
    <script>
      try {
        if (localStorage.getItem('analisar-solo:tema') !== 'claro') document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
